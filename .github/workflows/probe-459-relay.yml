name: Probe 459 relay
# THROWAWAY (#459 decision 4), the second half of probe-459.yml. A review
# fires no `pull_request_target`, so the lock's verdict on an approval has to
# come through a `workflow_run`, which runs the default branch's copy. This
# measures what that relay receives: which SHA and pull requests its payload
# names when the triggering run came from `pull_request_target` or
# `pull_request_review`, whether its token can post a status on the PR head,
# and whether it can read the PR's reviews. Removed by the #459
# implementation.
on:
  workflow_run:
    workflows: ['Probe 459 tokens']
    types: [completed]
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  relay:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Report the payload and post a status on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          api() { curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$@"; }
          echo "run_event=$RUN_EVENT actor=$ACTOR triggering_actor=$TRIGGERING_ACTOR run_head_sha=$RUN_HEAD_SHA run_head_branch=$RUN_HEAD_BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "pull_requests=$(jq -c '[.[] | {number, head: .head.sha, base: .base.ref}]' <<<"$RUN_PRS")" | tee -a "$GITHUB_STEP_SUMMARY"
          pr=$(jq -r '.[0].number // empty' <<<"$RUN_PRS")
          head=$(jq -r '.[0].head.sha // empty' <<<"$RUN_PRS")
          if [ -z "$pr" ]; then echo "no pull request in the payload" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          body=$(jq -nc --arg c "probe-459-relay/$RUN_EVENT" --arg d "actor $ACTOR" '{state:"success",context:$c,description:$d}')
          code=$(api -o status.json -w '%{http_code}' -X POST "https://api.github.com/repos/$REPO/statuses/$head" -d "$body")
          echo "POST statuses/pr-head -> HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(api -o reviews.json -w '%{http_code}' "https://api.github.com/repos/$REPO/pulls/$pr/reviews")
          echo "GET pulls/$pr/reviews -> HTTP $code $(jq -c '[.[]? | {user: .user.login, state, commit_id}]' reviews.json)" | tee -a "$GITHUB_STEP_SUMMARY"
