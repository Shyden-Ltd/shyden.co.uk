name: Release — dev (deploy + verify, gates the merge)
# THE PROMOTION GATE. Fires on every push to `develop`. Runs the full
# comprehensive suite, deploys to dev, then VERIFIES the deployed dev site and
# posts a `dev-verified` commit status on the SHA.
#
# Why dev and not prod is the gate: a pipeline that deploys to production
# before the code is on `main` makes production the place a mistake first
# becomes real — in front of teachers. It also means `main` briefly does not
# describe what is live. Verifying in dev inverts both: a bad build stops at a
# site nobody but us can reach, and prod only ever runs a commit that is
# already on `main`.
#
# Automatic on every push to `develop`, and still dispatchable by hand.
#
# The old trigger was dispatch-ONLY, for a real reason: dev is a single shared
# environment, and every PR branch deploying to it would mean the last push
# wins, with `dev-verified` describing whichever branch happened to land last.
#
# An integration branch removes that competition by construction rather than by
# discipline. Exactly one branch deploys to dev, so "last push wins" stops being
# ambiguous — dev always shows develop's head, which is what dev should show.
# The dev deploy also stops being a step anyone can forget, which is what made
# the merge gate skippable.
#
# `workflow_dispatch` stays as an escape hatch for putting an arbitrary branch
# on dev. The status step below is guarded so that hatch cannot become a bypass.
#
# concurrency below keeps `cancel-in-progress: false`: rapid merges must QUEUE,
# never cancel a half-finished deploy.

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: release-dev-shyden
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---- Gate 1: comprehensive web tests -----------------------------------
  test:
    name: Comprehensive web tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      # Only when something failed, and only then. `actions/upload-artifact`
      # is first-party -- the same `actions` org as checkout and setup-node
      # above -- so this adds no new trust boundary, and it is SHA-pinned with
      # its version comment like every other action here.
      - name: Keep the failing run's Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          # `warn`, never `ignore`: `ignore` is the one value that lets this
          # step go GREEN having preserved nothing, and this step IS the
          # evidence path for a red run (#131).
          if-no-files-found: warn

  # ---- Dev deploy --------------------------------------------------------
  deploy-dev:
    name: Deploy to Dev
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: dev
      url: https://dev.shyden.co.uk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (dev — outbound ShyTalk link → DEV, never prod)
        env:
          PUBLIC_SHYTALK_URL: https://dev.shytalk.shyden.co.uk
        run: npm run build
      - name: Deploy dist/ to Cloudflare Pages (dev project)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@4
          wrangler pages deploy dist --project-name shyden-site-dev --branch main

  # ---- Verify the DEPLOYED dev site, then post dev-verified --------------
  # This job is the point of the whole file. Before it existed, "deployed to
  # dev" meant only that `wrangler` did not error: tests/dev/dev-sanity.spec.ts
  # and playwright.dev.config.ts were both written for exactly this and were
  # referenced by NOTHING in CI, so a dev deploy serving a blank page would
  # have gone green and gated nothing.
  verify-dev:
    name: Verify dev + dev-verified
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Sanity-check the live dev site
        env:
          # The dev site is behind Basic auth; the username half is ignored by
          # the gate. playwright.dev.config.ts reads this and sets
          # httpCredentials from it.
          DEV_BASIC_AUTH_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
          WEB_BASE_URL: https://dev.shyden.co.uk
        run: npx playwright test --config=playwright.dev.config.ts
      - name: Post dev-verified status on the deployed commit
        # Deploy and verify whatever ref a dispatch points at, but publish the
        # STATUS only for develop. `dev-verified` is what branch protection on
        # `main` requires, so an unguarded dispatch would let any feature branch
        # earn it and then open a PR straight into `main` — skipping develop and
        # the integration it exists to force.
        if: github.ref_name == 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context=dev-verified \
            -f "description=Dev deployed + verified (run ${{ github.run_id }})" \
            -f "target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Posted dev-verified=success on ${{ github.sha }}"
