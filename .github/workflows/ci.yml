name: CI
# The REQUIRED status check on BOTH long-lived branches: `develop`, where work
# integrates, and `main`, which describes what is live.
#
# PR-only on purpose: release-dev.yml re-runs this same full suite as its own
# gate on every push to develop, and release-prod.yml gates the push to main, so
# a push: trigger here would only double the work on each merge.
#
# The bases are NAMED rather than left as a bare `pull_request:`. A bare trigger
# happens to cover both today, which is precisely the problem — nothing records
# that both are required, so losing one would be silent.
on:
  pull_request:
    branches: [develop, main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run build
      - run: npm run test:unit
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      # Only when something failed, and only then. `actions/upload-artifact`
      # is first-party -- the same `actions` org as checkout and setup-node
      # above -- so this adds no new trust boundary, and it is SHA-pinned with
      # its version comment like every other action here.
      - name: Keep the failing run's Playwright traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
