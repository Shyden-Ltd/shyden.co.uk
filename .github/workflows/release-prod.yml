name: Release — prod (on merge to main, approval-gated)
# PROD DEPLOYS FROM MAIN, AFTER THE MERGE. Fires on every push to `main` and
# waits at the `prod` Environment approval gate, so nothing reaches
# shyden.co.uk without a deliberate approval — and whatever is live is always a
# commit that is on `main`.
#
# This replaced a deploy-BEFORE-merge pipeline. That one made production the
# gate: a mistake first became real in front of teachers, and for the length of
# a release `main` did not describe what was live. The merge gate is now
# `dev-verified` (release-dev.yml).
#
# `workflow_dispatch` is kept for the case main is already correct and prod
# needs re-deploying — a rollback that is forward rather than backward, and the
# only way to re-run this without an empty commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-prod-shyden
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-prod:
    name: Deploy to Prod (needs approval)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: prod
      url: https://shyden.co.uk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (prod defaults — outbound ShyTalk link → PROD)
        run: npm run build
      - name: Guard — fail if a [[placeholder]] leaked into shipped text
        # -I: skip binary files. woff/woff2 fonts contain the bytes `[[`; a
        # placeholder leak is a TEXT concern, so scanning binaries false-fails.
        #
        # Matches the placeholder SHAPE — `[[` … `]]` with no `]` between —
        # rather than a bare `[[`. A bare `[[` is ordinary JavaScript: the
        # minified bundle contains `new Map([[k,v],[k,v]])`, which blocked a
        # release on 2026-08-05 with nothing wrong with the site. This is the
        # second false positive of the same kind (see the `-I` note above), and
        # both had the same cause — matching a fragment instead of the thing.
        #
        # It stays safe against that syntax because `[^]]` cannot cross the
        # first `]`, so `[[k,v],` never completes the pattern. Verified against
        # a real build: 0 matches, while an injected `[[companyNo]]` and an
        # injected `[[reg office]]` are both caught.
        run: |
          if grep -rnIE '\[\[[^]]{1,60}\]\]' dist/; then
            echo "::error::A [[…]] placeholder reached dist/ — refusing to ship to prod."
            exit 1
          fi
          echo "No bracket placeholders in dist/ (text)."
      - name: Deploy dist/ to Cloudflare Pages (prod project)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@4
          wrangler pages deploy dist --project-name shyden-site --branch main

  # ---- Post-prod smoke + prod-verified -----------------------------------
  # Smokes the live prod DEPLOYMENT alias (shyden-site.pages.dev, tester-locked
  # with DEV_PASSWORD) — cutover-independent, so this works before the apex DNS
  # points at the project.
  #
  # `prod-verified` is no longer what branch protection requires (that is
  # `dev-verified` now, posted before the merge). It is kept because it is a
  # per-commit RECORD of what actually reached production and passed a smoke —
  # visible on the commit, queryable by the API, and the thing to look at when
  # asking "was this SHA ever live?".
  smoke-and-verify:
    name: Post-prod smoke + prod-verified
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Smoke the live prod deployment
        env:
          SMOKE_PW: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          BASE="https://shyden-site.pages.dev"

          # Homepage: 200 + is the Shyden site.
          code=$(curl -s -o home.html -w '%{http_code}' -u "x:$SMOKE_PW" "$BASE/")
          [ "$code" = "200" ] || { echo "::error::homepage HTTP $code"; exit 1; }
          grep -qi 'shyden' home.html || { echo "::error::homepage missing 'shyden'"; exit 1; }

          # Cross-env: prod ShyTalk link present, dev link absent.
          grep -q 'https://shytalk.shyden.co.uk' home.html || { echo "::error::prod ShyTalk link missing"; exit 1; }
          if grep -q 'https://dev.shytalk.shyden.co.uk' home.html; then echo "::error::DEV ShyTalk link leaked into prod"; exit 1; fi

          # Real legal footer, no bracket placeholder.
          grep -q '17110487' home.html || { echo "::error::footer company number missing"; exit 1; }

          # EVERY page this site serves, in BOTH languages — not just the two
          # that happened to exist when this smoke was first written. The
          # release of 2026-08-12 rebuilt the Classroom Group Creator from
          # nothing and this smoke would have passed with that page 404ing,
          # because it only ever fetched the homepage and the calculator.
          for path in /glory-points /classroom-groups /id/ /id/glory-points /id/classroom-groups; do
            code=$(curl -sL -o page.html -w '%{http_code}' -u "x:$SMOKE_PW" "$BASE$path")
            [ "$code" = "200" ] || { echo "::error::$path HTTP $code"; exit 1; }
            # Non-trivial: a Cloudflare error page or an empty build is a 200.
            bytes=$(wc -c < page.html)
            [ "$bytes" -gt 2000 ] || { echo "::error::$path served only $bytes bytes"; exit 1; }
          done

          # The calculator still explains itself.
          curl -sL -o gp.html -u "x:$SMOKE_PW" "$BASE/glory-points"
          grep -qi 'How to use it' gp.html || { echo "::error::calculator instructions missing"; exit 1; }

          # The Classroom Group Creator still SHIPS ITS SCRIPT. This page is a
          # tool, and a partial deploy that dropped the bundle would leave a
          # form that looks fine and does nothing.
          curl -sL -o cg.html -u "x:$SMOKE_PW" "$BASE/classroom-groups"
          grep -q 'id="cg-form"' cg.html || { echo "::error::classroom-groups form missing"; exit 1; }
          grep -qE '<script[^>]+src="[^"]*\.js"' cg.html || { echo "::error::classroom-groups ships no script"; exit 1; }

          # The homepage still ships NO script — a promise this site makes and
          # the kind of thing a bundler change breaks silently.
          if grep -qE '<script[^>]+src="[^"]*\.js"' home.html; then
            echo "::error::the homepage now ships JavaScript"; exit 1;
          fi

          echo "Prod smoke passed against $BASE"
      - name: Post prod-verified status on the released commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context=prod-verified \
            -f "description=Prod deployed + smoke-verified (run ${{ github.run_id }})" \
            -f "target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Posted prod-verified=success on ${{ github.sha }}"
