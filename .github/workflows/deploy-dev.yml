name: Deploy shyden.co.uk to Dev
# Manually deploy the static site to the private dev Cloudflare Pages
# project (shyden-site-dev → dev.shyden.co.uk, Basic-auth locked).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to deploy. Blank = the ref selected in the dropdown above (branches/tags only — use this field for a commit SHA).'
        required: false
        type: string
        default: ''

# Dev deploys serialize — a queued deploy waits for the running one
# rather than racing on the same Pages project.
concurrency:
  group: deploy-shyden-dev
  cancel-in-progress: false

# This workflow never writes to the repo — it only reads code and deploys to
# Cloudflare. Pin GITHUB_TOKEN to read-only so a compromised dependency pulled
# by `npm ci` / wrangler (which run in the same job that holds the Cloudflare
# token) can't abuse repo write scope.
permissions:
  contents: read

jobs:
  deploy-web-dev:
    name: Build + Deploy Web to Dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # Full history when a specific ref is requested so any commit
          # SHA is reachable; shallow otherwise. String '0'/'1' — a
          # numeric 0 is falsy in GHA expressions and would break the
          # `&&/||` ternary.
          fetch-depth: ${{ inputs.ref != '' && '0' || '1' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (dev — outbound ShyTalk link points at DEV, never prod)
        env:
          # Env-derived cross-product URL: the dev site must link to dev
          # ShyTalk, not the prod site. index.astro defaults to prod when unset.
          PUBLIC_SHYTALK_URL: https://dev.shytalk.shyden.co.uk
        run: npm run build
      - name: Deploy dist/ to Cloudflare Pages (dev project)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `functions/` at the repo root ships the Basic-auth middleware;
        # wrangler bundles it alongside the dist/ static assets.
        run: |
          npm install -g wrangler@4
          wrangler pages deploy dist --project-name shyden-site-dev --branch main

  sanity-check:
    name: Dev Sanity Check
    needs: deploy-web-dev
    if: needs.deploy-web-dev.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: ${{ inputs.ref != '' && '0' || '1' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Sanity-check the deployed dev site
        env:
          WEB_BASE_URL: https://dev.shyden.co.uk
          # Same shared password as the Pages DEV_PASSWORD variable —
          # lets Playwright reach the page through the Basic-auth gate.
          DEV_BASIC_AUTH_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
        run: npx playwright test --config=playwright.dev.config.ts --reporter=list
