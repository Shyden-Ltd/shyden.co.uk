name: Probe 459 tokens
# THROWAWAY (#459 decision 4). Measures, on the real runner, what the job's
# GITHUB_TOKEN can do under each trigger the `operator-review` lock would use,
# before the spec is amended. Removed by the #459 implementation.
#
# Each run reports its actor, the PR head, whether it could post a commit
# status on that head (context `probe-459/<event>`, never a required name),
# and what a read token sees of develop's protection. It checks out nothing
# and runs no pull-request code; every event value reaches the shell through
# `env:`, never interpolated into the script.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
  pull-requests: read
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Report the token and post a status on the head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          api() { curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$@"; }
          echo "event=$EVENT actor=$ACTOR triggering_actor=$TRIGGERING_ACTOR pr_author=$PR_AUTHOR head=$HEAD_SHA run_sha=$RUN_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          body=$(jq -nc --arg c "probe-459/$EVENT" --arg d "actor $ACTOR" '{state:"success",context:$c,description:$d}')
          code=$(api -o status.json -w '%{http_code}' -X POST "https://api.github.com/repos/$REPO/statuses/$HEAD_SHA" -d "$body")
          echo "POST statuses/head -> HTTP $code" | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(api -o branch.json -w '%{http_code}' "https://api.github.com/repos/$REPO/branches/develop")
          echo "GET branches/develop -> HTTP $code protection=$(jq -c '.protection.required_status_checks' branch.json)" | tee -a "$GITHUB_STEP_SUMMARY"
